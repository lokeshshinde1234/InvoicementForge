version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoiceforge
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build: ./apps/backend
    env_file:
      - ./apps/backend/.env
    ports:
      - '3001:3001'
    depends_on:
      - db
      - redis

  frontend:
    build: ./apps/frontend
    env_file:
      - ./apps/frontend/.env.local
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  db-data:
